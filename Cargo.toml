[package]
name = "sluice"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
spider_client = { git = "https://github.com/Ocelmot/spider", rev = "2a49c6c5a630ae2ed2eb57f567c0f9d64bc1a438"}
tokio = { version = "1", features = ["full", "tracing"] }
serde_json = "1.0.73"

rppal = "0.22.1"
chrono = "0.4.42"

tracing-subscriber = {version = "0.3.23", features = ["env-filter"]}
